name: Build & Deploy Nano Cloud Codec

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: |
          npm config set registry https://registry.npmjs.org/
          npm ci || npm install

      - name: Install emsdk
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install 3.1.64
          ./emsdk activate 3.1.64
          echo "EMSDK=$GITHUB_WORKSPACE/emsdk" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
          source ./emsdk_env.sh
          emcc -v

      - name: Build WASM kernel
        run: |
          source "$EMSDK/emsdk_env.sh"
          cd wasm
          bash build.sh
          mkdir -p ../public
          cp build/snca_codec.js build/snca_codec.wasm ../public/
          ls -la ../public/

      - name: Vite production build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://hlwqtlrkwhuogcwnhjrs.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_r7yKRKkp-98kOmtH2MxA3Q_CfeozGBf' }}
          VITE_RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL || 'https://nano-cloud-backend.onrender.com' }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
